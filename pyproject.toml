[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "greet-community"
version = "0.1.0"
description = "A small Python package that greets people"
authors = [{name = "Seongwan-Ahn"}]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
